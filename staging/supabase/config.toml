# Hosted STAGING project settings (visuallearn-staging, ref tyoplurznjqdngacvfke).
# Applied with: supabase config push --workdir staging --project-ref <ref>
# Only declared properties are pushed. SYNTHETIC data only; never production.
# The private research schemas stay out of the Data API.
project_id = "visuallearn-staging"

[api]
schemas = ["public", "graphql_public"]

# Every connection string uses sslmode=require; refuse unencrypted clients.
[db.ssl_enforcement]
enabled = true

[auth]
# Hosted on Vercel (bom1). Per-person dev logins are revoked, so links
# return only to the hosted accept page.
site_url = "https://visuallearn-staging.vercel.app"
additional_redirect_urls = ["https://visuallearn-staging.vercel.app/admin/accept"]
# Researcher accounts are created by an administrator; no public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
jwt_expiry = 3600
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# Provider stays on for researcher password sign-in.
enable_signup = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
